<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <!-- Network graph visualization -->
  <g transform="translate(200, 155)">
    <!-- Edges -->
    <line x1="0" y1="0" x2="-60" y2="-50" stroke="#38bdf8" stroke-width="2.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="65" y2="-40" stroke="#6366f1" stroke-width="2.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="-55" y2="45" stroke="#818cf8" stroke-width="2.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="60" y2="50" stroke="#38bdf8" stroke-width="2.5" opacity="0.5"/>
    <line x1="-60" y1="-50" x2="-90" y2="-15" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
    <line x1="65" y1="-40" x2="95" y2="-5" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
    <line x1="-60" y1="-50" x2="-30" y2="-80" stroke="#818cf8" stroke-width="2" opacity="0.3"/>
    <line x1="65" y1="-40" x2="50" y2="-75" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
    <line x1="-55" y1="45" x2="-90" y2="25" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
    <line x1="60" y1="50" x2="90" y2="30" stroke="#818cf8" stroke-width="2" opacity="0.3"/>
    <!-- Central node -->
    <circle cx="0" cy="0" r="18" fill="url(#accent)" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#0f172a"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
    <!-- Primary nodes -->
    <circle cx="-60" cy="-50" r="12" fill="#6366f1" opacity="0.8"/>
    <circle cx="65" cy="-40" r="12" fill="#38bdf8" opacity="0.8"/>
    <circle cx="-55" cy="45" r="12" fill="#818cf8" opacity="0.8"/>
    <circle cx="60" cy="50" r="12" fill="#6366f1" opacity="0.8"/>
    <!-- Secondary nodes -->
    <circle cx="-90" cy="-15" r="7" fill="#38bdf8" opacity="0.5"/>
    <circle cx="95" cy="-5" r="7" fill="#6366f1" opacity="0.5"/>
    <circle cx="-30" cy="-80" r="7" fill="#818cf8" opacity="0.5"/>
    <circle cx="50" cy="-75" r="7" fill="#38bdf8" opacity="0.5"/>
    <circle cx="-90" cy="25" r="7" fill="#6366f1" opacity="0.5"/>
    <circle cx="90" cy="30" r="7" fill="#818cf8" opacity="0.5"/>
  </g>
  <!-- Magnifying glass overlay -->
  <g transform="translate(290, 100)" opacity="0.6">
    <circle cx="0" cy="0" r="18" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <line x1="13" y1="13" x2="25" y2="25" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Label -->
  <text x="200" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">CODEBASE</text>
  <text x="200" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">EXPLORER</text>
</svg>

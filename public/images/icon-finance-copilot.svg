<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <!-- Dollar sign in shield -->
  <g transform="translate(200, 160)">
    <!-- Shield outline -->
    <path d="M0,-70 L55,-50 L55,10 Q55,55 0,75 Q-55,55 -55,10 L-55,-50 Z" 
          stroke="url(#accent)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Dollar sign -->
    <text x="0" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" fill="url(#accent2)">$</text>
    <!-- Small bar chart to the right -->
    <rect x="70" y="-10" width="12" height="40" rx="3" fill="#10b981" opacity="0.4"/>
    <rect x="88" y="-30" width="12" height="60" rx="3" fill="#10b981" opacity="0.55"/>
    <rect x="106" y="-50" width="12" height="80" rx="3" fill="#10b981" opacity="0.7"/>
    <!-- Lock icon (privacy) -->
    <rect x="-95" y="-15" width="24" height="20" rx="4" fill="#10b981" opacity="0.4"/>
    <path d="M-89,-15 L-89,-25 Q-89,-35 -83,-35 Q-77,-35 -77,-25 L-77,-15" stroke="#10b981" stroke-width="3" fill="none" opacity="0.4"/>
  </g>
  <!-- Label -->
  <text x="200" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">FINANCE</text>
  <text x="200" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">COPILOT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <!-- Robot / Agent head -->
  <g transform="translate(200, 140)">
    <!-- Head outline -->
    <rect x="-45" y="-40" width="90" height="70" rx="16" stroke="url(#accent)" stroke-width="4" fill="none"/>
    <!-- Antenna -->
    <line x1="0" y1="-40" x2="0" y2="-60" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="0" cy="-65" r="7" fill="#8b5cf6"/>
    <!-- Signal waves -->
    <path d="M-15,-72 Q-8,-82 0,-72" stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M0,-72 Q8,-82 15,-72" stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- Eyes -->
    <circle cx="-18" cy="-10" r="10" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="18" cy="-10" r="10" fill="#6366f1" opacity="0.8"/>
    <circle cx="-18" cy="-10" r="5" fill="#e0e7ff"/>
    <circle cx="18" cy="-10" r="5" fill="#e0e7ff"/>
    <!-- Mouth / chat line -->
    <rect x="-20" y="12" width="40" height="4" rx="2" fill="#a78bfa" opacity="0.6"/>
  </g>
  <!-- Build / gear elements -->
  <g transform="translate(200, 140)">
    <!-- Left gear -->
    <circle cx="-70" cy="-5" r="16" stroke="#6366f1" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="-70" cy="-5" r="6" fill="#8b5cf6" opacity="0.5"/>
    <!-- Right gear -->
    <circle cx="70" cy="-5" r="16" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="70" cy="-5" r="6" fill="#6366f1" opacity="0.5"/>
    <!-- Connection lines to head -->
    <line x1="-45" y1="-5" x2="-54" y2="-5" stroke="#a78bfa" stroke-width="2" opacity="0.4"/>
    <line x1="45" y1="-5" x2="54" y2="-5" stroke="#a78bfa" stroke-width="2" opacity="0.4"/>
  </g>
  <!-- Chat bubbles below -->
  <g transform="translate(200, 220)">
    <rect x="-50" y="0" width="60" height="20" rx="10" fill="#8b5cf6" opacity="0.3"/>
    <rect x="-5" y="25" width="55" height="20" rx="10" fill="#6366f1" opacity="0.3"/>
    <!-- Dots in chat -->
    <circle cx="-30" cy="10" r="3" fill="#a78bfa" opacity="0.7"/>
    <circle cx="-20" cy="10" r="3" fill="#a78bfa" opacity="0.7"/>
    <circle cx="-10" cy="10" r="3" fill="#a78bfa" opacity="0.7"/>
    <circle cx="10" cy="35" r="3" fill="#a78bfa" opacity="0.7"/>
    <circle cx="20" cy="35" r="3" fill="#a78bfa" opacity="0.7"/>
    <circle cx="30" cy="35" r="3" fill="#a78bfa" opacity="0.7"/>
  </g>
  <!-- Label -->
  <text x="200" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">AGENT</text>
  <text x="200" y="333" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">BUILDER</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <!-- Code brackets -->
  <text x="200" y="180" text-anchor="middle" font-family="monospace" font-size="100" font-weight="bold" fill="url(#accent)">&lt;/&gt;</text>
  <!-- Underline bar -->
  <rect x="110" y="210" width="180" height="4" rx="2" fill="url(#accent2)" opacity="0.7"/>
  <!-- Portfolio text -->
  <text x="200" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#e2e8f0">PORTFOLIO</text>
  <!-- Small dots decoration -->
  <circle cx="140" cy="310" r="4" fill="#6366f1" opacity="0.5"/>
  <circle cx="170" cy="310" r="4" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="200" cy="310" r="4" fill="#a78bfa" opacity="0.5"/>
  <circle cx="230" cy="310" r="4" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="260" cy="310" r="4" fill="#6366f1" opacity="0.5"/>
</svg>
